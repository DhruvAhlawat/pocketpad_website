        <h2>Frequently Asked Questions</h2>
        <h3>How can I use my phone as a gamepad or game controller?</h3>
        <p>Install PocketPad on your Android phone. It turns your phone into a wireless gamepad with full Xbox-style and PlayStation-style layouts. Connect via Bluetooth HID (no app needed on your PC/Mac/TV) or via Wi‑Fi with the free PocketPad Companion on Windows for lowest latency.</p>
        <h3>How do I use my phone as a remote keyboard and mouse for my PC?</h3>
        <p>PocketPad includes a Universal layout with a full touchpad for mouse control and a typing panel for keyboard input. Connect your phone to your PC via Bluetooth HID or Wi‑Fi and your phone becomes a wireless keyboard and mouse.</p>

        <h3>Does PocketPad work without installing anything on my PC?</h3>
        <p>Yes. Bluetooth HID requires zero software on the host. Just pair and connect. Optionally install the free PocketPad Companion on Windows for even lower latency.</p>
